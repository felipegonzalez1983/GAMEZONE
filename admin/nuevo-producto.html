<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nuevo producto | Game Zone</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <aside class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-4">

                <h2 class="text-warning">
                    Game Zone
                </h2>

                <p>Administración</p>

                <hr>

                <nav>
                    <ul class="nav flex-column">

                        <li class="nav-item">
                            <a class="nav-link text-white" href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-warning" href="productos.html">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="usuarios.html">
                                Usuarios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="../index.html">
                                Volver a la tienda
                            </a>
                        </li>

                    </ul>
                </nav>

            </aside>

            <main class="col-md-9 col-lg-10 p-5">

                <h1>Nuevo producto</h1>

                <p>
                    Completa los datos para registrar un producto.
                </p>

                <form
                    id="formulario-producto"
                    class="mt-4"
                    novalidate>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="codigo" class="form-label">
                                Código
                            </label>

                            <input
                                type="text"
                                id="codigo"
                                class="form-control">

                            <small
                                id="error-codigo"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="nombre-producto" class="form-label">
                                Nombre
                            </label>

                            <input
                                type="text"
                                id="nombre-producto"
                                class="form-control"
                                maxlength="100">

                            <small
                                id="error-nombre-producto"
                                class="text-danger">
                            </small>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="descripcion" class="form-label">
                            Descripción
                        </label>

                        <textarea
                            id="descripcion"
                            class="form-control"
                            maxlength="500">
                        </textarea>

                        <small class="text-secondary">
                            Campo opcional. Máximo 500 caracteres.
                        </small>

                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">

                            <label for="precio" class="form-label">
                                Precio
                            </label>

                            <input
                                type="number"
                                id="precio"
                                class="form-control"
                                min="0"
                                step="0.01">

                            <small
                                id="error-precio"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-4 mb-3">

                            <label for="stock" class="form-label">
                                Stock
                            </label>

                            <input
                                type="number"
                                id="stock"
                                class="form-control"
                                min="0"
                                step="1">

                            <small
                                id="error-stock"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-4 mb-3">

                            <label for="stock-critico" class="form-label">
                                Stock crítico
                            </label>

                            <input
                                type="number"
                                id="stock-critico"
                                class="form-control"
                                min="0"
                                step="1">

                            <small class="text-secondary">
                                Campo opcional.
                            </small>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label for="categoria" class="form-label">
                            Categoría
                        </label>

                        <select
                            id="categoria"
                            class="form-select">

                            <option value="">
                                Seleccione una categoría
                            </option>

                            <option value="Consolas">
                                Consolas
                            </option>

                            <option value="Videojuegos">
                                Videojuegos
                            </option>

                            <option value="Accesorios">
                                Accesorios
                            </option>

                            <option value="Gaming PC">
                                Gaming PC
                            </option>

                            <option value="Coleccionables">
                                Coleccionables
                            </option>

                        </select>

                        <small
                            id="error-categoria"
                            class="text-danger">
                        </small>

                    </div>

                    <div class="mb-3">

                        <label for="imagen" class="form-label">
                            Imagen
                        </label>

                        <input
                            type="file"
                            id="imagen"
                            class="form-control"
                            accept="image/*">

                        <small class="text-secondary">
                            Campo opcional.
                        </small>

                    </div>

                    <div
                        id="mensaje-producto"
                        class="alert alert-success d-none">

                        Producto guardado correctamente.

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning">

                        Guardar producto

                    </button>

                    <a
                        href="productos.html"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                </form>

            </main>

        </div>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../JS/admin-productos.js"></script>

</body>

</html>
