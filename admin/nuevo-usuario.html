<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nuevo usuario | Game Zone</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <aside
                class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-4">

                <h2 class="text-warning">Game Zone</h2>

                <p>Administración</p>

                <hr>

                <nav>
                    <ul class="nav flex-column">

                        <li class="nav-item">
                            <a
                                class="nav-link text-white"
                                href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link text-white"
                                href="productos.html">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link text-warning"
                                href="usuarios.html">
                                Usuarios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a
                                class="nav-link text-white"
                                href="../index.html">
                                Volver a la tienda
                            </a>
                        </li>

                    </ul>
                </nav>

            </aside>

            <main class="col-md-9 col-lg-10 p-5">

                <h1>Nuevo usuario</h1>

                <p>
                    Completa los datos para registrar un usuario.
                </p>

                <form
                    id="formulario-usuario"
                    class="mt-4"
                    novalidate>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="rut"
                                class="form-label">

                                RUT

                            </label>

                            <input
                                type="text"
                                id="rut"
                                class="form-control"
                                placeholder="12.345.678-9">

                            <small
                                id="error-rut"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label
                                for="nombre"
                                class="form-label">

                                Nombre completo

                            </label>

                            <input
                                type="text"
                                id="nombre"
                                class="form-control"
                                maxlength="100">

                            <small
                                id="error-nombre"
                                class="text-danger">
                            </small>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="correo"
                                class="form-label">

                                Correo electrónico

                            </label>

                            <input
                                type="email"
                                id="correo"
                                class="form-control">

                            <small
                                id="error-correo"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label
                                for="contrasena"
                                class="form-label">

                                Contraseña

                            </label>

                            <input
                                type="password"
                                id="contrasena"
                                class="form-control"
                                minlength="4"
                                maxlength="10">

                            <small
                                id="error-contrasena"
                                class="text-danger">
                            </small>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label
                            for="rol"
                            class="form-label">

                            Rol

                        </label>

                        <select
                            id="rol"
                            class="form-select">

                            <option value="">
                                Seleccione un rol
                            </option>

                            <option value="Cliente">
                                Cliente
                            </option>

                            <option value="Administrador">
                                Administrador
                            </option>

                        </select>

                        <small
                            id="error-rol"
                            class="text-danger">
                        </small>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning">

                        Guardar usuario

                    </button>

                    <a
                        href="usuarios.html"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                </form>

            </main>

        </div>

    </div>

    <script src="../JS/admin-usuarios.js"></script>

</body>

</html>
