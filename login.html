<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Inicio de sesión de Game Zone.">

    <title>Iniciar sesión | Game Zone</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <custom-header></custom-header>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <h1 class="text-center mb-4">
                    Iniciar sesión
                </h1>

                <form id="formulario-login" novalidate>

                    <div class="mb-3">

                        <label
                            for="correo-login"
                            class="form-label">

                            Correo electrónico

                        </label>

                        <input
                            type="email"
                            id="correo-login"
                            class="form-control"
                            maxlength="100">

                        <small
                            id="error-correo-login"
                            class="text-danger">
                        </small>

                    </div>

                    <div class="mb-3">

                        <label
                            for="contrasena-login"
                            class="form-label">

                            Contraseña

                        </label>

                        <input
                            type="password"
                            id="contrasena-login"
                            class="form-control"
                            minlength="4"
                            maxlength="10">

                        <small
                            id="error-contrasena-login"
                            class="text-danger">
                        </small>

                    </div>

                    <div
                        id="mensaje-login"
                        class="alert alert-success d-none">

                        Inicio de sesión correcto.

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning w-100">

                        Ingresar

                    </button>

                </form>

                <p class="text-center mt-3">

                    ¿No tienes una cuenta?

                    <a href="registro.html">
                        Regístrate
                    </a>

                </p>

            </div>

        </div>

    </main>

    <custom-footer></custom-footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="JS/components/layout.js"></script>
    <script src="JS/main.js"></script>
    <script src="JS/login.js"></script>

</body>

</html>
