<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Game Zone</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <div class="container">

                <a class="navbar-brand" href="index.html">

                    <img
                        src="IMG/logo-game-zone.jpeg"
                        alt="Logo de Game Zone"
                        class="logo-tienda">

                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div
                    class="collapse navbar-collapse"
                    id="menuPrincipal">

                    <ul class="navbar-nav ms-lg-4">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">
                                Nosotros
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="blogs.html">
                                Blog
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">
                                Contacto
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="carrito.html">

                                🛒 Carrito

                                <span
                                    id="cantidad-carrito"
                                    class="badge bg-warning text-dark">

                                    0

                                </span>

                            </a>
                        </li>

                        <li class="nav-item">

                            <a
                                class="btn btn-warning ms-lg-2"
                                href="login.html">

                                Iniciar sesión

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <main>

        <section class="encabezado-pagina text-white text-center py-5">

            <div class="container">

                <h1>Registro de usuario</h1>

                <p>
                    Completa tus datos para crear una cuenta.
                </p>

            </div>

        </section>

        <section class="container py-5">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <form id="formulario-registro" novalidate>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="run" class="form-label">
                                    RUN
                                </label>

                                <input
                                    type="text"
                                    id="run"
                                    class="form-control"
                                    placeholder="Ejemplo: 19011022K"
                                    maxlength="9">

                                <small
                                    id="error-run"
                                    class="text-danger">
                                </small>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label for="nombre" class="form-label">
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control"
                                    maxlength="50">

                                <small
                                    id="error-nombre"
                                    class="text-danger">
                                </small>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="apellidos" class="form-label">
                                Apellidos
                            </label>

                            <input
                                type="text"
                                id="apellidos"
                                class="form-control"
                                maxlength="100">

                            <small
                                id="error-apellidos"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="mb-3">

                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                class="form-control"
                                placeholder="ejemplo@gmail.com"
                                maxlength="100">

                            <small
                                id="error-correo"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="mb-3">

                            <label for="fecha-nacimiento" class="form-label">
                                Fecha de nacimiento
                            </label>

                            <input
                                type="date"
                                id="fecha-nacimiento"
                                class="form-control">

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="region" class="form-label">
                                    Región
                                </label>

                                <select
                                    id="region"
                                    class="form-select">

                                    <option value="">
                                        Seleccione una región
                                    </option>

                                </select>

                                <small
                                    id="error-region"
                                    class="text-danger">
                                </small>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label for="comuna" class="form-label">
                                    Comuna
                                </label>

                                <select
                                    id="comuna"
                                    class="form-select"
                                    disabled>

                                    <option value="">
                                        Seleccione una comuna
                                    </option>

                                </select>

                                <small
                                    id="error-comuna"
                                    class="text-danger">
                                </small>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label for="direccion" class="form-label">
                                Dirección
                            </label>

                            <input
                                type="text"
                                id="direccion"
                                class="form-control"
                                maxlength="300">

                            <small
                                id="error-direccion"
                                class="text-danger">
                            </small>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label for="contrasena" class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    id="contrasena"
                                    class="form-control"
                                    minlength="4"
                                    maxlength="10">

                                <small
                                    id="error-contrasena"
                                    class="text-danger">
                                </small>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label for="repetir-contrasena" class="form-label">
                                    Repetir contraseña
                                </label>

                                <input
                                    type="password"
                                    id="repetir-contrasena"
                                    class="form-control"
                                    minlength="4"
                                    maxlength="10">

                                <small
                                    id="error-repetir-contrasena"
                                    class="text-danger">
                                </small>

                            </div>

                        </div>

                        <div
                            id="mensaje-registro"
                            class="alert alert-success d-none">

                            Usuario registrado correctamente.

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-warning btn-lg">

                                Registrarme

                            </button>

                        </div>

                        <p class="text-center mt-4">

                            ¿Ya tienes una cuenta?

                            <a href="login.html">
                                Iniciar sesión
                            </a>

                        </p>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <footer class="pie-pagina text-white text-center py-4">

        <div class="container">

            <p class="mb-0">
                Game Zone © 2026 - Proyecto académico Duoc UC
            </p>

        </div>

    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="JS/main.js"></script>

    <script src="JS/registro.js"></script>

</body>

</html>
